{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" class="{% block html_class %}h-full{% endblock %}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Git Showcase — Acesso de Alunos{% endblock %}</title>

  <!-- Google Fonts & Tailwind -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            navy: {
              DEFAULT: '#1A2332',
              light: '#2A3544',
              muted: '#5A6A7A',
              dark: '#0F1622',
              soft: '#3B4858',
            },
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CSS customizado da pasta static/css/styles.css -->
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
</head>
<body class="{% block body_class %}flex flex-col justify-between text-navy min-h-screen antialiased selection:bg-navy selection:text-white{% endblock %}">

  <!-- Container Global de Notificações Toast -->
  {% block toast_container %}
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none"></div>
  {% endblock %}

  <!-- CONTEÚDO ESPECÍFICO DE CADA PÁGINA -->
  {% block content %}
  {% endblock %}

  <!-- JS customizado da pasta static/js/script.js -->
  <script src="{% static 'js/script.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
