{% extends 'base.html' %}
{% load static %}

{% block title %}Login — Git Showcase{% endblock %}

{% block content %}
<main class="flex-1 flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-lg">
    
    <div id="loginCard" class="glass-card rounded-3xl p-6 sm:p-8 relative overflow-hidden">
      
      <div class="mb-6">
        <h2 class="text-2xl font-extrabold text-navy font-mono tracking-tight">Identifique-se</h2>
        <p class="text-sm text-navy-muted mt-1">Utilize suas credenciais de acesso ao colégio.</p>
      </div>

      <!-- Botão GitHub Temporariamente Inativo -->
      <button 
        type="button"
        onclick="showToast('Login via GitHub temporariamente em manutenção.', 'info')"
        class="w-full py-3.5 px-4 rounded-xl border border-navy/20 bg-white/50 text-navy/60 font-bold text-xs font-mono flex items-center justify-center gap-2.5 shadow-sm cursor-not-allowed mb-5"
      >
        <i data-lucide="github" class="w-4 h-4 text-navy/60"></i>
        <span>Entrar com GitHub (Em manutenção)</span>
      </button>

      <!-- Divisória -->
      <div class="relative flex py-2 items-center mb-4">
        <div class="flex-grow border-t border-navy/15"></div>
        <span class="flex-shrink mx-3 text-[11px] font-mono text-navy-muted uppercase font-semibold">Credenciais de Teste</span>
        <div class="flex-grow border-t border-navy/15"></div>
      </div>

      <!-- Formulário de Login Nativo -->
      <form method="post" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        
        <div>
          <label for="id_login" class="block text-xs font-bold text-navy uppercase tracking-wider mb-1.5">
            E-mail ou Usuário
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-navy-muted">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <input 
              type="text" 
              name="login" 
              id="id_login" 
              required
              placeholder="ex: aluno@escola.edu.br ou admin"
              class="w-full pl-10 pr-4 py-3 rounded-xl glass-input text-sm text-navy placeholder:text-navy-muted/60 focus:outline-none"
            />
          </div>
        </div>

        <div>
          <label for="id_password" class="block text-xs font-bold text-navy uppercase tracking-wider mb-1.5">
            Senha
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-navy-muted">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input 
              type="password" 
              name="password" 
              id="id_password" 
              required
              placeholder="••••••••"
              class="w-full pl-10 pr-12 py-3 rounded-xl glass-input text-sm text-navy placeholder:text-navy-muted/60 focus:outline-none"
            />
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full py-3.5 px-6 rounded-xl bg-navy text-white font-bold text-sm tracking-wide hover:bg-navy-light transition-all shadow-lg flex items-center justify-center gap-2 cursor-pointer font-mono"
        >
          Entrar no Portal <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

    </div>

  </div>
</main>
{% endblock %}
